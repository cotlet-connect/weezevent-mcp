[project]
name = "weezevent-mcp"
version = "1.0.0"
description = "Connect Weezevent to ChatGPT, Claude and any AI agent through Cotlet.dev, a hosted MCP server. No Weezevent API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["weezevent", "weezevent api", "weezevent mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/weezevent-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=weezevent"
Source = "https://github.com/cotlet-connect/weezevent-mcp"

[project.scripts]
weezevent-mcp = "weezevent_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"weezevent_agent.py" = "weezevent_agent.py"

[tool.hatch.build.targets.sdist]
include = ["weezevent_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
